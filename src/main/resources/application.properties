server.port=8080
spring.application.name=instrumentalsw-backend

saxo.ai.base-url=${SAXO_AI_BASE_URL:http://localhost:8000}
saxo.ai.connect-timeout=${SAXO_AI_CONNECT_TIMEOUT:2s}
saxo.ai.read-timeout=${SAXO_AI_READ_TIMEOUT:30s}
saxo.frontend.origin=${SAXO_FRONTEND_ORIGIN:http://localhost:3000}

spring.servlet.multipart.max-file-size=${SAXO_MAX_MULTIPART_FILE_SIZE:101MB}
spring.servlet.multipart.max-request-size=${SAXO_MAX_MULTIPART_REQUEST_SIZE:102MB}

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
