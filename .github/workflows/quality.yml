name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw
      - name: Verify
        shell: bash
        run: |
          set -o pipefail
          ./mvnw --batch-mode --no-transfer-progress verify 2>&1 | tee verify.log
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-quality-evidence
          path: |
            verify.log
            target/site/jacoco/jacoco.xml
            target/site/jacoco/jacoco.csv
          if-no-files-found: warn
          retention-days: 3
